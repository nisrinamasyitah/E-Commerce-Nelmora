# Render Blueprint: one web service with a persistent disk for the SQLite database and uploaded photos.
# In Render: New → Blueprint → pick this repository. You will be asked for ADMIN_PASSWORD and PUBLIC_URL.
services:
  - type: web
    name: nelmora-shop
    runtime: node
    region: singapore
    plan: starter            # a paid plan is required for a persistent disk
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # you type this in Render, it is never stored in GitHub
      - key: PUBLIC_URL
        sync: false          # e.g. https://nelmora-shop.onrender.com or https://nelmoraparfums.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: nelmora-data
      mountPath: /var/data
      sizeGB: 1
